<!--
  Favicon / PWA icons: use the same image as the sidebar avatar (site.avatar).
  Replaces the theme default under assets/img/favicons/*.png.
-->
{% assign avatar_href = site.avatar | relative_url %}

<link rel="icon" type="image/jpeg" href="{{ avatar_href }}">
<link rel="shortcut icon" href="{{ avatar_href }}">
<link rel="apple-touch-icon" href="{{ avatar_href }}">
{% if site.pwa.enabled %}
  <link rel="manifest" href="{{ '/assets/img/favicons/site.webmanifest' | relative_url }}">
{% endif %}
